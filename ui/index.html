<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Sublevel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="mock.js"></script>
  <script src="main.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top" data-tauri-drag-region>
    <span class="brand" data-tauri-drag-region>SUBLEVEL <span class="ver" id="launcherVer">v0.1.0</span></span>
    <nav class="links">
      <button class="link" data-link="news">새소식</button>
      <button class="link" data-link="support">고객센터</button>
      <span class="acct" id="acct" hidden><span id="nick"></span></span>
      <button class="icon" id="gear" aria-label="설정" aria-expanded="false">⚙</button>
      <button class="icon" id="min" aria-label="최소화">–</button>
      <button class="icon" id="close" aria-label="닫기">×</button>
    </nav>
    <div class="menu" id="menu" hidden>
      <button id="verifyMenu">파일 검사하기</button>
      <button id="logout">로그아웃</button>
    </div>
  </header>

  <!-- 진행 단계를 지하 층으로 표현하는 세로 타임라인 -->
  <ol class="timeline" id="timeline" aria-hidden="true"></ol>

  <main class="main">
    <section class="hero">
      <span class="chip" id="zone">ZONE B1 · 대기</span>
      <p class="caption" id="caption">지하 1층 · 출발 대기</p>
    </section>

    <section class="cards" id="tiles" aria-label="안내"></section>

    <footer class="deck">
      <div class="bar" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barA11y"><i id="fill"></i></div>
      <div class="row">
        <div class="pct" id="pct">0%</div>
        <dl class="stats">
          <div><dt>전체</dt><dd id="sTotal">–</dd></div>
          <div><dt>현재</dt><dd id="sDone">–</dd></div>
          <div><dt>남은시간</dt><dd id="sEta">–</dd></div>
          <div><dt>속도</dt><dd id="sSpeed">–</dd></div>
        </dl>
        <div class="side">
          <button id="verify" class="ghost" disabled>파일 검사하기</button>
          <label class="auto"><input type="checkbox" id="auto"> 설치 완료 후 바로 실행</label>
        </div>
        <button id="main" class="cta" disabled>확인 중…</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">확인하는 중…</p>
    </footer>
  </main>
</div>
</body>
</html>
