# Windows 런처 설치 파일을 GitHub Actions(windows-latest)에서 만든다. Mac은 로컬에서 빌드한다.
# 산출물(NSIS .exe)은 아티팩트로 받아 sublevel-web/scripts/launcher_upload.sh 로 서버에 올린다. 비밀 값 없음.
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src-tauri/**", "ui/**", "package*.json", ".github/workflows/build.yml"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: sublevel-launcher-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
