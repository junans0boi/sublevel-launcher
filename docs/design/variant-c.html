<!doctype html><meta charset="utf-8"><title>C안 구역 봉쇄 보드</title>
<style>
:root{--bg:#0B0F14;--panel:#10151C;--line:#2A3340;--text:#E6ECF2;--sub:#98A5B3;--accent:#FF6A2B}
*{box-sizing:border-box}body{margin:0;width:1040px;height:656px;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;padding:24px 28px;display:grid;grid-template-rows:auto 220px 1fr auto;gap:16px;overflow:hidden}
h1{margin:0;font-size:15px;letter-spacing:.3em;display:flex;justify-content:space-between}h1 small{color:var(--sub);letter-spacing:.1em;font-weight:400}
.hero{border:1px solid var(--line);border-radius:14px;background:url(../../ui/img/hero.jpg) center 20%/cover;position:relative}
.hero b{position:absolute;left:16px;bottom:12px;font:600 12px ui-monospace,monospace;background:var(--bg);border:1px solid var(--accent);color:var(--accent);padding:2px 10px;border-radius:6px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.z{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;align-content:space-between}.z small{font:600 12px ui-monospace,monospace;color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-bottom:8px}.seg i{height:14px;border-radius:3px;background:var(--line)}.seg i.on{background:var(--accent)}
.bottom{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.pct{font:600 28px ui-monospace,monospace;color:var(--accent);margin-right:14px}
.cta{padding:0 40px;height:56px;border-radius:8px;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:18px;display:grid;place-items:center}
</style>
